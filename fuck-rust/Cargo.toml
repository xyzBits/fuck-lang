[workspace]
resolver = "2"

members = ["my-macros", "order-event-dispatcher", "rust-basic"
    , "rust-crates", "rust-ffi"]

# 在这里定义的依赖，子项目可以通过 { workspace = true } 来引用
[workspace.dependencies]
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
